title: SWIFT Confirmation Message Content in Alliance Access Message Files
id: 5b8c1e3a-7d4f-4a9c-b2e6-1f8a3c9d7e2b
status: experimental
description: |
    Detects creation/modification of .prc/.fal message files under
    Alliance Access message-store directories (mcm\, mcp\, mcf\)
    containing FIN 900 confirmation strings or transaction-monitoring
    field tags. Matches the message-monitoring behavior of the 2016
    Bangladesh Bank heist malware.
references:
    - https://baesystemsai.blogspot.com/2016/04/two-bytes-to-951m.html
author: Hazem Akkouh
date: 2026/09/19
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\mcm\'
            - '\mcp\'
            - '\mcf\'
        TargetFilename|endswith:
            - '.prc'
            - '.fal'
    condition: selection_path
falsepositives:
    - This rule alone only confirms activity in the expected message-store directories, which is largely expected under normal operation.
level: low
