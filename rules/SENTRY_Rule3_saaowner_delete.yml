title: Unauthorized DELETE on SWIFT Alliance Access SAAOWNER Schema
id: 9a1e4f2b-3c7d-4e8a-b1f5-6d2c8a4e7b9f
status: experimental
description: |
    Detects DELETE statements executed against SAAOWNER.MESG_% or
    SAAOWNER.TEXT_% tables, the schema used by SWIFT Alliance Access to
    store SWIFT financial messages. Matches the technique used to
    remove database records of fraudulent transactions in the 2016
    Bangladesh Bank heist.
references:
    - https://baesystemsai.blogspot.com/2016/04/two-bytes-to-951m.html
author: Hazem Akkouh
date: 2026/09/19
tags:
    - attack.impact
    - attack.t1565.001
logsource:
    product: oracle_dbms
    category: audit
detection:
    selection:
        action_name: 'DELETE'
        object_name|startswith:
            - 'MESG_'
            - 'TEXT_'
        object_schema: 'SAAOWNER'
    filter_expected_service_account:
        dbusername: 'SAA_SERVICE'  # placeholder: substitute with the actual authorized application account name
    condition: selection and not filter_expected_service_account
falsepositives:
    - Legitimate Alliance Access housekeeping/archival jobs may periodically purge old message records.
    - Database migration or schema-maintenance activity performed by DBAs.
level: critical
